<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Anas Mohamed — full-stack engineer">
  <title>Anas Mohamed — full-stack engineer</title>
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4590a"/>
      <stop offset="55%" stop-color="#bf3989"/>
      <stop offset="100%" stop-color="#0969da"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <!-- userSpaceOnUse: a horizontal line has a zero-height bbox, which makes an
         objectBoundingBox gradient degenerate and the stroke disappear entirely. -->
    <linearGradient id="rule" gradientUnits="userSpaceOnUse"
                    x1="46" y1="0" x2="386" y2="0">
      <stop offset="0%" stop-color="#d4590a"/>
      <stop offset="50%" stop-color="#bf3989"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="0.5" y="0.5" width="879" height="239" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .prompt { fill: #1a7f37; font-size: 15px; font-weight: 700; }
    .cmd    { fill: #1f2328;    font-size: 15px; font-weight: 600; }
    .tag    { fill: #818b98;   font-size: 12px; letter-spacing: .04em; }
    .sub    { fill: #59636e; font-size: 14.5px; }
    .accent { fill: #d4590a;    font-size: 14.5px; font-weight: 600; }
    .accent2{ fill: #0969da;    font-size: 14.5px; font-weight: 600; }

    .ch {
      font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size: 44px; font-weight: 800;
      fill: url(#name); opacity: 0;
      animation: pop .28s cubic-bezier(.2,.9,.3,1.4) forwards;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .caret {
      fill: #0969da;
      animation: travel 0.90s steps(12,end) .55s both,
                 blink 1.05s steps(2,jump-none) 1.45s infinite;
    }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(360px); } }
    @keyframes blink  { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .cursor2 { fill: #1f2328; animation: blink 1.05s steps(2,jump-none) infinite; }

    .fade   { opacity: 0; animation: fadein .6s ease forwards; }
    @keyframes fadein { to { opacity: 1; } }

    .sweep  { animation: sweep 7s cubic-bezier(.4,0,.2,1) 1.4s infinite; }
    @keyframes sweep { 0% { transform: translateX(-320px); } 55%,100% { transform: translateX(880px); } }

    .rule   { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1.6s ease-out .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .steam  { stroke: #818b98; stroke-width: 2.5; stroke-linecap: round; fill: none; opacity: 0; }
    .s1 { animation: rise 3.2s ease-out 0.2s infinite; }
    .s2 { animation: rise 3.2s ease-out 1.2s infinite; }
    .s3 { animation: rise 3.2s ease-out 2.2s infinite; }
    @keyframes rise {
      0%   { opacity: 0;   transform: translateY(6px)  scaleX(.85); }
      25%  { opacity: .55; }
      70%  { opacity: .18; }
      100% { opacity: 0;   transform: translateY(-16px) scaleX(1.15); }
    }

    .grid { opacity: 0.9; }
    .cell { animation: ripple 4.5s ease-in-out infinite; }
    @keyframes ripple {
      0%, 55%, 100% { opacity: .30; }
      22%           { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ch, .caret, .fade, .sweep, .rule, .steam, .cursor2, .cell { animation: none; opacity: 1; }
      .caret { transform: translateX(360px); }
      .rule  { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="240" fill="#ffffff"/>

    <!-- window chrome -->
    <rect width="880" height="36" fill="#f6f8fa"/>
    <line x1="0" y1="36" x2="880" y2="36" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="22" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="18" r="5.5" fill="#e3b341"/>
    <circle cx="62" cy="18" r="5.5" fill="#1a7f37"/>
    <text class="mono tag" x="440.0" y="22" text-anchor="middle">anas@arch — ~/dev — zsh</text>

    <!-- $ whoami -->
    <g class="fade" style="animation-delay:.1s">
      <text class="mono prompt" x="24" y="82">❯</text>
      <text class="mono cmd" x="46" y="82">whoami</text>
    </g>

    <!-- typed name + caret -->
    <g>
      <text class="ch" x="61" y="142" text-anchor="middle" style="animation-delay:0.550s">A</text>
      <text class="ch" x="91" y="142" text-anchor="middle" style="animation-delay:0.625s">n</text>
      <text class="ch" x="121" y="142" text-anchor="middle" style="animation-delay:0.700s">a</text>
      <text class="ch" x="151" y="142" text-anchor="middle" style="animation-delay:0.775s">s</text>
