      <text class="ch" x="301" y="142" text-anchor="middle" style="animation-delay:1.150s">a</text>
      <text class="ch" x="331" y="142" text-anchor="middle" style="animation-delay:1.225s">m</text>
      <text class="ch" x="361" y="142" text-anchor="middle" style="animation-delay:1.300s">e</text>
      <text class="ch" x="391" y="142" text-anchor="middle" style="animation-delay:1.375s">d</text>
      <rect class="caret" x="46" y="108" width="16" height="42" rx="2"/>
    </g>

    <!-- underline rule -->
    <line class="rule" x1="46" y1="158" x2="386" y2="158"
          stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>

    <!-- subtitle -->
    <g class="fade" style="animation-delay:1.7s">
      <text class="mono sub" x="46" y="184">
        <tspan class="accent">full-stack</tspan><tspan> engineer · </tspan><tspan class="accent2">rust</tspan><tspan> + </tspan><tspan class="accent2">typescript</tspan><tspan> · fayoum, egypt</tspan>
      </text>
    </g>

    <!-- trailing prompt -->
    <g class="fade" style="animation-delay:2.1s">
      <text class="mono prompt" x="24" y="214">❯</text>
      <rect class="cursor2" x="46" y="202" width="11" height="16" rx="1.5"/>
    </g>

