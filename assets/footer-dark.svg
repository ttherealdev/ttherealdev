<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fg1" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="840" y2="0">
      <stop offset="0%"   stop-color="#ff7b35" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#ff7b35"/>
      <stop offset="60%"  stop-color="#f778ba"/>
      <stop offset="90%"  stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .line {
      fill: none; stroke: url(#fg1); stroke-width: 2.5; stroke-linecap: round;
      stroke-dasharray: 1600; stroke-dashoffset: 1600;
      animation: draw 2.4s ease-out forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { fill: #f778ba; animation: run 4.5s linear 1.2s infinite; }
    @keyframes run {
      0%   { transform: translateX(40px);  opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      100% { transform: translateX(840px); opacity: 0; }
    }
    .txt { fill: #8b949e; font-size: 13px; opacity: 0; animation: fadein .8s ease 1.6s forwards; }
    .hl  { fill: #f778ba; font-weight: 700; }
    @keyframes fadein { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .pulse, .txt { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <path class="line" d="M40 46 H300 l14 -20 l16 40 l14 -20 H520 l12 -14 l14 28 l12 -14 H840"/>
  <circle class="pulse" cx="0" cy="46" r="4.5"/>
  <text class="mono txt" x="440.0" y="84" text-anchor="middle">
    <tspan>❯ </tspan><tspan class="hl">git commit</tspan><tspan> -m "thanks for stopping by" &amp;&amp; </tspan><tspan class="hl">git push</tspan>
  </text>
</svg>
